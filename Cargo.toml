[package]
name = "comline"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ComlineProject/cli"
description = "Command-line interface for Comline: build, validate, diff and generate code from Comline schemas"
readme = "README.md"
keywords = ["comline", "schema", "codegen", "idl", "cli"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
clap = { version = "4.5.4", features = ["derive", "cargo"] }
clap_complete = "4.5"
miette = { version = "7.2.0", features = ["fancy"] }
thiserror = "1.0"
anstream = "0.6"
anstyle = "1.0"
indicatif = "0.17"
notify-debouncer-mini = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# git rev (not crates.io) so this and the `comline-codegen*` crates share one
# `comline-core` in the tree. Local dev: see .cargo/config. `deps` is this
# crate's opt-in: cross-package `dependencies = {...}` resolution (core#6) —
# needs real I/O (git fetch, filesystem), so it's off by default for
# `comline-core`'s wasm32 consumers (the playground editor, the language
# server); the CLI is the one consumer that actually runs `comline build`.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "3c9d299f6967008eec505f0950c2590a0b9ffb08", features = ["deps"] }
# All three pinned to revs that already agree on comline-core@3c9d299
# (core#71 - parse errors point at the actual unclosed bracket instead of
# spanning the whole file) - bumped together: generation#37's branch-tip
# commit (comline-rust/comline-typescript's own codegen crates consume
# `comline-codegen`'s types, so this pins the exact same generation rev
# they do - e9420c6, not generation's later merge commit, since Cargo
# only unifies a git dependency across byte-identical revs), then
# comline-rust#26 and comline-typescript#23.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "e9420c64705013ff5d507bfee3a6691e1bccf152" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "9684bd24442912cbd02451a5403166737c67bffb", optional = true }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "e89e4c461267c8d4806be1a4ed3b71bcdb270501", optional = true }

[features]
# Which language generators are compiled in. Drop one to shed its whole
# dependency tree from the build. A build with neither can compile but
# `comline generate` will find no generator.
default = ["gen-rust", "gen-typescript"]
gen-rust = ["dep:comline-codegen-rust"]
gen-typescript = ["dep:comline-codegen-typescript"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
clap = { version = "4.5.4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
