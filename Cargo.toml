[package]
name = "comline"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ComlineProject/cli"
description = "Command-line interface for Comline: build, validate, diff and generate code from Comline schemas"
readme = "README.md"
keywords = ["comline", "schema", "codegen", "idl", "cli"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
clap = { version = "4.5.4", features = ["derive", "cargo"] }
clap_complete = "4.5"
miette = { version = "7.2.0", features = ["fancy"] }
thiserror = "1.0"
anstream = "0.6"
anstyle = "1.0"
indicatif = "0.17"
notify-debouncer-mini = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# git rev (not crates.io) so this and the `comline-codegen*` crates share one
# `comline-core` in the tree. Local dev: see .cargo/config. `deps` is this
# crate's opt-in: cross-package `dependencies = {...}` resolution (core#6) —
# needs real I/O (git fetch, filesystem), so it's off by default for
# `comline-core`'s wasm32 consumers (the playground editor, the language
# server); the CLI is the one consumer that actually runs `comline build`.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "1ec7ad15aae2c44c369c8983a6f5cab96733dbe1", features = ["deps"] }
# All three pinned to revs that already agree on comline-core@1ec7ad1
# (the embedded std, core#62) — bumped together: generation#32's first commit
# (comline-rust/comline-typescript's own codegen crates consume
# `comline-codegen`'s types, so this pins the same generation rev they do,
# not a later one), then comline-rust#20 and comline-typescript#18.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "f83897ee570074110c35a653bfd4caa7f22224da" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "d59e81a3b2aa3965985934d115e51767150e46fc", optional = true }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "017f79924863f3e44811adf780d83ede87506185", optional = true }

[features]
# Which language generators are compiled in. Drop one to shed its whole
# dependency tree from the build. A build with neither can compile but
# `comline generate` will find no generator.
default = ["gen-rust", "gen-typescript"]
gen-rust = ["dep:comline-codegen-rust"]
gen-typescript = ["dep:comline-codegen-typescript"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
clap = { version = "4.5.4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
