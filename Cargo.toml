[package]
name = "comline"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ComlineProject/cli"
description = "Command-line interface for Comline: build, validate, diff and generate code from Comline schemas"
readme = "README.md"
keywords = ["comline", "schema", "codegen", "idl", "cli"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
clap = { version = "4.5.4", features = ["derive", "cargo"] }
clap_complete = "4.5"
miette = { version = "7.2.0", features = ["fancy"] }
thiserror = "1.0"
anstream = "0.6"
anstyle = "1.0"
indicatif = "0.17"
notify-debouncer-mini = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# The error type of `comline-core`'s `build_with` check, which `build` passes.
eyre = "0.6.8"
# git rev (not crates.io) so this and the `comline-codegen*` crates share one
# `comline-core` in the tree. Local dev: see .cargo/config. `deps` is this
# crate's opt-in: cross-package `dependencies = {...}` resolution (core#6) —
# needs real I/O (git fetch, filesystem), so it's off by default for
# `comline-core`'s wasm32 consumers (the playground editor, the language
# server); the CLI is the one consumer that actually runs `comline build`.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "98d64faedfc48ab4d2c93722e2b099debedd503c", features = ["deps"] }
# All three pinned to revs that agree on one `comline-codegen`, and bumped
# together: comline-rust and comline-typescript's codegen crates consume
# `comline-codegen`'s types, so the rev below must be byte-identical to the
# one *they* pin - Cargo only unifies a git dependency across identical rev
# strings, and two copies of `GenRequest` are two incompatible types.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "b116831182c32e70fb4452ff9fce4b463ce4bd99" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "0e5c60ebdfab9cd172f23691a18084d651bfb33a", optional = true }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "765fc2d1177d0044498b00160000ac5084540af2", optional = true }
# Runs a `generator = "<path>.wasm"` target (see src/external.rs): no
# preopened directories, no environment, no network. Exact pins, bumped
# together.
wasmtime = { version = "=49.0.3", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=49.0.3", optional = true, default-features = false, features = ["p1"] }
# Only for the `AsyncWrite` trait wasmtime-wasi's stdio streams implement.
tokio = { version = "1", default-features = false, optional = true }

[features]
# Which language generators are compiled in. Drop one to shed its whole
# dependency tree from the build. A build with neither can compile but
# `comline generate` will find no generator.
default = ["gen-rust", "gen-typescript", "gen-wasm"]
gen-rust = ["dep:comline-codegen-rust"]
gen-typescript = ["dep:comline-codegen-typescript"]
# Running `.wasm` generators under wasmtime. Without it, a `generator` path
# to a `.wasm` is an error naming the feature; native executables still run.
gen-wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:tokio"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
clap = { version = "4.5.4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
