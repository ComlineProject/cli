[package]
name = "comline"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ComlineProject/cli"
description = "Command-line interface for Comline: build, validate, diff and generate code from Comline schemas"
readme = "README.md"
keywords = ["comline", "schema", "codegen", "idl", "cli"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
clap = { version = "4.5.4", features = ["derive", "cargo"] }
clap_complete = "4.5"
miette = { version = "7.2.0", features = ["fancy"] }
thiserror = "1.0"
anstream = "0.6"
anstyle = "1.0"
indicatif = "0.17"
notify-debouncer-mini = "0.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# git rev (not crates.io) so this and the `comline-codegen*` crates share one
# `comline-core` in the tree. Local dev: see .cargo/config.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "aa84d970d3295df59cc3e620bdb71bf96382f97b" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "4f29f4fce4e2e0b3775e4d687a7188112eaf58e3" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/generation", rev = "4f29f4fce4e2e0b3775e4d687a7188112eaf58e3" }
comline-codegen-typescript = { git = "https://github.com/ComlineProject/comline-typescript", rev = "97d8b2ea3db8b0489eaa8a1ad1fa2e89cfb391e6" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
clap = { version = "4.5.4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
