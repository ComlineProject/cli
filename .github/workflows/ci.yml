name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The external-generator tests build their fixture generators for
          # wasm32-wasip1 (tests/cli/external.rs).
          targets: wasm32-wasip1
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (without gen-wasm)
        run: cargo clippy --all-targets --no-default-features --features gen-rust,gen-typescript -- -D warnings
      - name: rustfmt (fixture generators)
        run: cargo fmt --check --manifest-path tests/fixtures/generators/Cargo.toml
