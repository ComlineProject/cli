# Implementations the integration tests run under `comline conformance`
# (tests/cli/conformance.rs), built there. Its own workspace: not part of the
# CLI's build.
[package]
name = "comline-test-conformance"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The runtime rev the CLI pins `comline-runtime-conformance` at, so the
# reference answers as the vectors the CLI reads were blessed.
comline-reference = { git = "https://github.com/ComlineProject/runtime", rev = "6f8f73a247f0aa4ac8b7041b2fdc4b02bce0e0d6" }
serde_json = "1.0"
