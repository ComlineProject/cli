# Generators the integration tests run as external generators
# (tests/cli/external.rs), built there natively and for wasm32-wasip1. Its own
# workspace: not part of the CLI's build.
[package]
name = "comline-test-generators"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The same revs the CLI pins, so the real generator's output is comparable
# byte for byte with the CLI's built-in one.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "5eb12c00a6ce93842695a27f175d873609617bd9" }
comline-doc-markdown = { git = "https://github.com/ComlineProject/generation", rev = "5eb12c00a6ce93842695a27f175d873609617bd9" }
comline-doc-html = { git = "https://github.com/ComlineProject/generation", rev = "5eb12c00a6ce93842695a27f175d873609617bd9" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "b999d6793f17f2fc1356ddf4bbeddc989c117d69" }
