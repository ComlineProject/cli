# Generators the integration tests run as external generators
# (tests/cli/external.rs), built there natively and for wasm32-wasip1. Its own
# workspace: not part of the CLI's build.
[package]
name = "comline-test-generators"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The same revs the CLI pins, so the real generator's output is comparable
# byte for byte with the CLI's built-in one.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "d7f90ec45736793683071d3a823fa8bb6c022712" }
comline-doc-markdown = { git = "https://github.com/ComlineProject/generation", rev = "d7f90ec45736793683071d3a823fa8bb6c022712" }
comline-doc-html = { git = "https://github.com/ComlineProject/generation", rev = "d7f90ec45736793683071d3a823fa8bb6c022712" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "aa0419c3e36e3eafd2173f61e7b9f45e3e335c1b" }
