# Generators the integration tests run as external generators
# (tests/cli/external.rs), built there natively and for wasm32-wasip1. Its own
# workspace: not part of the CLI's build.
[package]
name = "comline-test-generators"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The same revs the CLI pins, so the real generator's output is comparable
# byte for byte with the CLI's built-in one.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "ca5fae8c9c22753e33dbd801f436c714909cb2aa" }
comline-doc-markdown = { git = "https://github.com/ComlineProject/generation", rev = "ca5fae8c9c22753e33dbd801f436c714909cb2aa" }
comline-doc-html = { git = "https://github.com/ComlineProject/generation", rev = "ca5fae8c9c22753e33dbd801f436c714909cb2aa" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "232b41e75a3b377db374d337affffc2f50c31758" }
