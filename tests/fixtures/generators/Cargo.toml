# Generators the integration tests run as external generators
# (tests/cli/external.rs), built there natively and for wasm32-wasip1. Its own
# workspace: not part of the CLI's build.
[package]
name = "comline-test-generators"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The same revs the CLI pins, so the real generator's output is comparable
# byte for byte with the CLI's built-in one.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "4d047a8763a7e7a73c7e8128fc3aea67763b0ce3" }
comline-doc-markdown = { git = "https://github.com/ComlineProject/generation", rev = "4d047a8763a7e7a73c7e8128fc3aea67763b0ce3" }
comline-doc-html = { git = "https://github.com/ComlineProject/generation", rev = "4d047a8763a7e7a73c7e8128fc3aea67763b0ce3" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "5831687d52277c366038cc66452587bda74c867a" }
