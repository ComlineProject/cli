# Generators the integration tests run as external generators
# (tests/cli/external.rs), built there natively and for wasm32-wasip1. Its own
# workspace: not part of the CLI's build.
[package]
name = "comline-test-generators"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The same revs the CLI pins, so the real generator's output is comparable
# byte for byte with the CLI's built-in one.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "211483f8c185c079a7b32bf7bbdc27a1a180ae45" }
comline-doc-markdown = { git = "https://github.com/ComlineProject/generation", rev = "211483f8c185c079a7b32bf7bbdc27a1a180ae45" }
comline-doc-html = { git = "https://github.com/ComlineProject/generation", rev = "211483f8c185c079a7b32bf7bbdc27a1a180ae45" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "b06af29fd2ce85dd974762986e954a89c326b812" }
