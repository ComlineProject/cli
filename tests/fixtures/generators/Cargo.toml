# Generators the integration tests run as external generators
# (tests/cli/external.rs), built there natively and for wasm32-wasip1. Its own
# workspace: not part of the CLI's build.
[package]
name = "comline-test-generators"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The same revs the CLI pins, so the real generator's output is comparable
# byte for byte with the CLI's built-in one.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "bfa3845e7eecd42905344f4230fa1999d0c2c399" }
comline-doc-markdown = { git = "https://github.com/ComlineProject/generation", rev = "bfa3845e7eecd42905344f4230fa1999d0c2c399" }
comline-doc-html = { git = "https://github.com/ComlineProject/generation", rev = "bfa3845e7eecd42905344f4230fa1999d0c2c399" }
comline-codegen-rust = { git = "https://github.com/ComlineProject/comline-rust", rev = "e56d0697edf8898fbfd80b73fdb2dd7eb1dcd681" }
